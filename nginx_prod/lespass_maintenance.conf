# =============================================================================
# CONF TEMPORAIRE DE MAINTENANCE — « TiBillet fait peau neuve ».
# / TEMPORARY MAINTENANCE CONF — "TiBillet fait peau neuve".
#
# LOCALISATION : nginx_prod/lespass_maintenance.conf
# PAGE SERVIE  : nginx_prod/maintenance/index.html (+ polices, volutes, logos)
#
# A QUOI CA SERT. Pendant une mise a jour longue (plusieurs heures), nginx ne
# transmet plus rien a Django : TOUTE requete, sur TOUS les domaines (tous les
# lieux), recoit la page de maintenance avec un code 503.
# / During a long update, nginx forwards nothing to Django: every request, on
# every domain, gets the maintenance page with a 503.
#
# POURQUOI 503 ET PAS 200. Le 503 + `Retry-After` dit aux moteurs de recherche
# « indisponible pour un moment, repasse plus tard » : ils ne remplacent pas
# les pages indexees par la page de maintenance. Les clients d'API (caisses,
# terminaux) voient aussi une erreur claire au lieu d'un HTML a 200.
# / 503 + Retry-After: search engines keep the indexed pages; API clients get
# an explicit error instead of a 200 HTML page.
#
# COMMENT L'ACTIVER :
#   1. Dans docker-compose.prod.yml, service lespass_nginx, remplacer la ligne
#        - ./nginx_prod/lespass_prod.conf:/etc/nginx/conf.d/default.conf:ro
#      par
#        - ./nginx_prod/lespass_maintenance.conf:/etc/nginx/conf.d/default.conf:ro
#      et AJOUTER le dossier de la page :
#        - ./nginx_prod/maintenance:/maintenance:ro
#   2. Recreer nginx : docker compose -f docker-compose.prod.yml up -d lespass_nginx
#
# COMMENT REVENIR : remettre la ligne lespass_prod.conf (le volume
# /maintenance peut rester, il ne gene pas), puis recreer nginx.
#
# CONTENEUR APPLICATIF ARRETE. Comme lespass_bascule.conf, cette conf ne nomme
# jamais `lespass_django` : nginx demarre meme si Django est arrete ou en
# train de migrer. Le `links:` du compose peut rester tel quel tant que le
# conteneur existe ; s'il est supprime, commenter le `links:`.
# / Never names `lespass_django`: nginx boots even with Django down.
#
# NI /static NI /media. La page ne charge que ses propres fichiers, montes
# dans le conteneur sous /maintenance/ : /www/static peut etre en cours de
# reecriture par collectstatic pendant la mise a jour.
# / The page only loads its own files, mounted under /maintenance/.
# =============================================================================


# Meme format que la conf normale, pour que les logs restent lisibles par les
# memes outils. / Same access format as the normal conf.
log_format tibillet
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $host$request_uri $server_protocol" '
    '$status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time';


server {

    listen 80;
    server_name localhost;

    # Vraie IP du visiteur (voir lespass_prod.conf pour le detail).
    # / Real visitor IP (see lespass_prod.conf).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /logs/nginxAccess.log tibillet;
    error_log /logs/nginxError.log;


    # -------------------------------------------------------------------------
    # Les fichiers de la page (polices, volutes, logos). Servis en 200, sinon
    # le navigateur ne les utiliserait pas.
    # La page les appelle en chemins RELATIFS (fonts/…, fond/…, logo/…) pour
    # s'ouvrir aussi en local. Or nginx la sert sur n'importe quelle URL : vue
    # depuis /event/concert/, `fond/x.svg` devient /event/concert/fond/x.svg.
    # D'ou cette regex : tout chemin qui FINIT par fonts|fond|logo/<fichier>
    # est servi depuis /maintenance/. Noms limites a [A-Za-z0-9._-] et aux
    # trois extensions utilisees : rien d'autre ne sort du dossier.
    # / Relative asset paths: any URL ENDING in fonts|fond|logo/<file> is
    # served from /maintenance/. Strict file name and extension whitelist.
    # -------------------------------------------------------------------------
    location ~ /(fonts|fond|logo)/([A-Za-z0-9._-]+\.(woff2|svg|png))$ {
        alias /maintenance/$1/$2;
        add_header Cache-Control "public, max-age=3600" always;
    }


    # -------------------------------------------------------------------------
    # TOUT LE RESTE — pages, API, admin, websockets : 503 + la page.
    # `error_page` sert index.html en GARDANT le code 503.
    # / EVERYTHING ELSE: 503 + the page. error_page keeps the 503 status.
    # -------------------------------------------------------------------------
    location / {
        return 503;
    }

    error_page 503 /maintenance-page;

    location = /maintenance-page {
        # `internal` : inaccessible en direct, seulement via error_page.
        # / Only reachable through error_page.
        internal;
        alias /maintenance/index.html;
        default_type text/html;
        charset utf-8;

        # Indicatif pour les robots : repasser dans une heure.
        # / Hint for crawlers: come back in an hour.
        add_header Retry-After 3600 always;
        # Jamais en cache : a la fin de la mise a jour, le visiteur doit
        # retomber sur le vrai site, pas sur une copie de cette page.
        # / Never cached: visitors must get the real site once it is back.
        add_header Cache-Control "no-store" always;
    }

}
