{% extends "laboutik/base.html" %}
{% load static i18n %}
<!--
ECRAN AUTONOME DE CHOIX DE TABLE
/ Standalone table picker screen

LOCALISATION : laboutik/templates/laboutik/views/tables.html

Aucune vue ne rend ce gabarit aujourd'hui : l'ecran restaurant affiche la meme
grille par-dessus l'ecran de vente (views/restaurant_interface.html).
Il reutilise le meme composant pour garder un seul style.
Pas d'ecran de vente dessous : le bouton « Continuer sans table » est cache.
-->
{% block content %}
  <c-header title="{{ title }}" />
  <c-tables-definition avec_bouton_continuer="non" />
{% endblock content %}
{% block css %}
  <link rel="stylesheet" href="{% static 'css/restaurant_interface.css' %}" />
{% endblock css %}
