<c-vars width="80%" height="80%" mode="remove" />
<div class="c-modal" {{ attrs }}>
  {% if mode == 'remove' %}
    <div class="c-modal-close"
         onclick="document.querySelector('#{{ id }}').remove()"></div>
  {% else %}
    <div class="c-modal-close"
         onclick="document.querySelector('#{{ id }}').style.display='none'"></div>
  {% endif %}
  <div class="c-modal-body" style="width:{{ width }};height:{{ height }}">
    <div class="c-modal-header">
      {{ header }}
      <button class="c-modal-bt-close"
              aria-label="Fermer"
              {% if mode == 'remove' %} onclick="document.querySelector('#{{ id }}').remove()" {% else %} onclick="document.querySelector('#{{ id }}').style.display='none'" {% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.6 4.2 12 10.6l6.4-6.4L20.2 6 13.8 12.4l6.4 6.4-1.8 1.8-6.4-6.4-6.4 6.4-1.8-1.8 6.4-6.4-6.4-6.4z"></path>
        </svg>
      </button>
    </div>
    <div class="c-modal-main">{{ main }}</div>
    <div class="c-modal-footer">
      {{ footer }}
      <button {% if mode == 'remove' %} onclick="document.querySelector('#{{ id }}').remove()" {% else %} onclick="document.querySelector('#{{ id }}').style.display='none'" {% endif %}>
        Return
      </button>
    </div>
  </div>
</div>
<style>
  .c-modal {    
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.5); 
    z-index: 9999;
  }

  .c-modal-close {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
  }

  .c-modal-body {
    position: relative;
    width: 80%;
    height: 80%;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--surface-3) transparent;
    color: var(--text);
    font-family: var(--font-ui);
    padding: 18px 18px 16px;
    border-radius: var(--r-panel);
    box-shadow: 0 0 0 1px var(--line), 0 30px 70px oklch(0 0 0 / .6);
    animation: pop .16s var(--ease);
    background-color: rgba(0, 0, 0, 1); 
  }

  .c-modal-header { 
    width: 100%;
    height: 10%;
    font-size: 1.5rem;
    font-weight: bold;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
  }

  .c-modal-bt-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13px;
  }

  .c-modal-main { 
    width: 100%;
    height: 80%;
    font-size: 1rem;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .c-modal-footer { 
    width: 100%;
    height: 10%;
    font-size: 1rem;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
  }

</style>
