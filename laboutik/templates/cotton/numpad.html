{% load static i18n %}
<link rel="stylesheet" href="{% static 'css/numpad.css' %}" />
<div {{ attrs }} class="numpad-content">
  <div class="numpad-touch numpad-size">7</div>
  <div class="numpad-touch numpad-size">8</div>
  <div class="numpad-touch numpad-size">9</div>
  <div class="numpad-touch numpad-size">4</div>
  <div class="numpad-touch numpad-size">5</div>
  <div class="numpad-touch numpad-size">6</div>
  <div class="numpad-touch numpad-size">1</div>
  <div class="numpad-touch numpad-size">2</div>
  <div class="numpad-touch numpad-size">3</div>
  <div class="numpad-touch numpad-size">0</div>
  <div class="numpad-touch numpad-size">.</div>
  <div class="numpad-touch numpad-size">C</div>
  <script>
  function manageKeyboard(event) {
    const element = event.target
    if(element.className.includes('numpad-touch')) {
      const key = element.textContent
      sendEvent('keypadSendValue','{{ ck_target }}', {key})
    }
  }
  document.querySelector('#{{ id }}').addEventListener('click', manageKeyboard)
  </script>
</div>
