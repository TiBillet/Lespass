# Drop-in systemd pour pigpiod.service (deploye par make deploy dans
# /etc/systemd/system/pigpiod.service.d/override.conf).
# / systemd drop-in for pigpiod.service (deployed by make deploy).
#
# Constate sur TiBeerV09 le 2026-09-20 : pigpiod ignore parfois SIGTERM a l'extinction
# et systemd attendait son TimeoutStopSec par defaut (90 s) avant SIGKILL — d'ou
# « A stop job is running for pigpiod.service » pendant plus d'une minute a l'ecran.
# On borne l'attente. Sans effet sur la vanne : tibeer l'a deja fermee avant
# (Requires/After), et tuer pigpiod ne change pas le niveau d'une broche.
# / Seen on TiBeerV09 2026-09-20: pigpiod sometimes ignores SIGTERM at shutdown and
# systemd waited its default 90 s before SIGKILL. We cap the wait. Valve-safe: tibeer
# already closed it (Requires/After) and killing pigpiod does not change a pin level.
[Service]
TimeoutStopSec=10