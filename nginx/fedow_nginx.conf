server {

    listen 80;
    server_name localhost;

    access_log /logs/nginxAccess.log;
    # Aussi sur la sortie du conteneur : `docker compose logs` et la supervision
    # les voient. Le fichier ci-dessus reste (rotation 14 jours en prod).
    # / Also on the container output (compose logs, monitoring); the file stays.
    access_log /dev/stdout;
    error_log /logs/nginxError.log;
    error_log stderr warn;

    location /static {
        root /www;
    }

    location /media {
        root /www;
    }

    location / {
        # everything is passed to Gunicorn
        proxy_pass http://fedow_django:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

