                  additionalType: "IMAGE_TEXTE"
                  headline: "Nos ateliers"
                  text: "<p>Découvrez nos ateliers hebdomadaires.</p>"
                  image: "https://exemple.fr/atelier.jpg"
                  additionalProperty:
                    - "@type": "PropertyValue"
                      name: "bouton_label"
                      value: "Réserver"
                    - "@type": "PropertyValue"
                      name: "bouton_url"
                      value: "/event/"
              galerieBloc:
                summary: "Bloc GALERIE avec liste ImageObject[]"
                value:
                  additionalType: "GALERIE"
                  headline: "Notre galerie"
                  image:
                    - "@type": "ImageObject"
                      contentUrl: "https://exemple.fr/img1.jpg"
                      caption: "Salle principale"
                    - "@type": "ImageObject"
                      contentUrl: "https://exemple.fr/img2.jpg"
                      caption: "Terrasse"
              iframeBloc:
                summary: "Bloc IFRAME (contenu intégré libre, hauteur fixe)"
                description: >-
                  L'iframe n'est rendu que si l'hôte de embed_url est autorisé par le
                  superadmin ROOT (whitelist globale). hauteur_px : hauteur du cadre.
                value:
                  additionalType: "IFRAME"
                  headline: "Le plan d'accès"
                  additionalProperty:
                    - "@type": "PropertyValue"
                      name: "embed_url"
                      value: "https://www.openstreetmap.org/export/embed.html?bbox=..."
                    - "@type": "PropertyValue"
                      name: "hauteur_px"
                      value: 420
              newsletterBloc:
                summary: "Bloc NEWSLETTER (formulaire d'inscription Ghost)"
                description: >-
                  embed_url = l'instance Ghost (data-site). headline/alternativeHeadline
                  = titre/description du formulaire. Le script Ghost est servi en local.
                value:
                  additionalType: "NEWSLETTER"
                  headline: "Les news de TiBillet"
                  alternativeHeadline: "La boîte à outils d'organisation collective"
                  additionalProperty:
                    - "@type": "PropertyValue"
                      name: "embed_url"
                      value: "https://ghost.exemple.coop/"
              partenairesBloc:
                summary: "Bloc PARTENAIRES (bande de logos cliquables)"
                description: >-
                  Comme GALERIE, image = liste d'ImageObject. La clé `url` (optionnelle)
                  rend le logo cliquable (nouvel onglet) ; les schémas dangereux sont
                  neutralisés côté serveur.
                value:
                  additionalType: "PARTENAIRES"
                  headline: "Ils nous soutiennent"
                  image:
                    - "@type": "ImageObject"
                      contentUrl: "https://exemple.fr/logo-alpha.png"
                      caption: "Coop Alpha"
                      url: "https://alpha.exemple/"
                    - "@type": "ImageObject"
                      contentUrl: "https://exemple.fr/logo-beta.png"
                      caption: "Asso Beta"
          multipart/form-data:
            schema:
              type: object
              properties:
                additionalType:
                  type: string
                  example: IMAGE_TEXTE
                headline:
                  type: string
                alternativeHeadline:
                  type: string
                text:
                  type: string
                  description: "Contenu HTML (nettoyé par nh3 côté serveur)"
                image:
                  type: string
                  format: binary
                  description: "Fichier image (JPEG/PNG/WebP, ≤ 10 Mo)"
                image_secondaire:
                  type: string
                  format: binary
                auteur_photo:
                  type: string
                  format: binary
                position:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPageElement'
        '400':
          description: "Bad Request — tentative SSRF, image invalide, type de bloc inconnu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/blocs/{uuid}/:
    patch:
      operationId: patchBloc
      summary: "Modifie un bloc (JSON ou multipart)"
      description: |
        FR: Édite un bloc par son uuid. Mêmes formats que POST (JSON ou multipart).
        Protection anti-SSRF identique. Les schémas dangereux dans les champs lien
        (bouton_url, bouton2_url, embed_url) sont neutralisés automatiquement
        (champ vidé, pas d'erreur retournée).

        EN: Updates a bloc by its uuid. Same formats as POST (JSON or multipart).
        Same anti-SSRF protection. Dangerous URL schemes in link fields
        (bouton_url, bouton2_url, embed_url) are silently neutralized (field cleared).
      tags: [Page]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebPageElementCreate'
          multipart/form-data:
            schema:
              type: object
              properties:
                headline:
                  type: string
                alternativeHeadline:
                  type: string
                text:
                  type: string
                  description: "HTML nettoyé par nh3"
                image:
                  type: string
                  format: binary
                image_secondaire:
                  type: string
                  format: binary
                auteur_photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPageElement'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteBloc
      summary: Supprime un bloc
      tags: [Page]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  # --- Bénévolat (droit de clé `volunteering`) / Volunteering ---
  /api/v2/volunteer-tasks/:
    get:
      operationId: listVolunteerTasks
      summary: "Bénévolat — les tâches du lieu (DefinedTerm)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/VolunteerTask'}
        "403": {description: "Clé sans le droit `volunteering`"}
    post:
      operationId: createVolunteerTask
      summary: "Bénévolat — créer une tâche"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerTaskInput'}
            example: {name: "Tenir le bar", description: "Derrière le comptoir, avec un·e habitué·e."}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerTask'}
        "400": {description: "Nom manquant"}
  /api/v2/volunteer-tasks/{uuid}/:
    parameters:
      - {in: path, name: uuid, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVolunteerTask
      summary: "Bénévolat — lire une tâche"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerTask'}
        "404": {description: "Introuvable"}
    patch:
      operationId: patchVolunteerTask
      summary: "Bénévolat — modifier une tâche (name, description)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerTaskInput'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerTask'}
    delete:
      operationId: deleteVolunteerTask
      summary: "Bénévolat — supprimer une tâche"
      description: "409 si la tâche sert encore à un besoin (« Cette tâche sert encore à N besoins »)."
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "204": {description: Deleted}
        "409": {description: "Tâche encore utilisée par des besoins"}
  /api/v2/volunteer-plannings/:
    get:
      operationId: listVolunteerPlannings
      summary: "Bénévolat — les plannings (EventSeries), sans leurs besoins"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/VolunteerPlanning'}
    post:
      operationId: createVolunteerPlanning
      summary: "Bénévolat — créer un planning"
      description: |
        FR: `name` obligatoire ; dans `additionalProperty` : `slug` (obligatoire), `published`,
        `delaiDesinscriptionHeures`. Les adhésions requises et le calendrier de fermetures se
        règlent dans l'admin (lecture seule ici). Slugs réservés : `besoin`, `desistement`.
        EN: Memberships and closing calendar are read-only (admin-only).
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerPlanningInput'}
            example:
              name: "Bar associatif : novembre"
              description: "On ouvre le bar deux soirs par semaine."
              additionalProperty:
                - {name: slug, value: bar-novembre}
                - {name: published, value: true}
                - {name: delaiDesinscriptionHeures, value: 24}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerPlanning'}
        "400": {description: "Slug manquant, déjà pris ou réservé"}
  /api/v2/volunteer-plannings/{uuid}/:
    parameters:
      - in: path
        name: uuid
        required: true
        description: "uuid OU slug du planning"
        schema: {type: string}
    get:
      operationId: getVolunteerPlanning
      summary: "Bénévolat — lire un planning, avec ses besoins (subEvent)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerPlanning'}
        "404": {description: "Introuvable"}
    patch:
      operationId: patchVolunteerPlanning
      summary: "Bénévolat — modifier un planning (name, description, slug, published, delaiDesinscriptionHeures)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerPlanningInput'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerPlanning'}
    delete:
      operationId: deleteVolunteerPlanning
      summary: "Bénévolat — supprimer un planning, ses besoins et leurs inscriptions (sans mail)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "204": {description: Deleted}
  /api/v2/volunteer-needs/:
    get:
      operationId: listVolunteerNeeds
      summary: "Bénévolat — les besoins (Event « Volunteering »), passés compris"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      parameters:
        - {in: query, name: planning, schema: {type: string, format: uuid}}
        - {in: query, name: task, schema: {type: string, format: uuid}}
        - {in: query, name: dateFrom, schema: {type: string, format: date}}
        - {in: query, name: dateTo, schema: {type: string, format: date}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/VolunteerNeed'}
    post:
      operationId: createVolunteerNeed
      summary: "Bénévolat — créer un besoin"
      description: |
        FR: `startDate` = une date seule (journée entière, pas de `endDate`) ou une date et une
        heure (`endDate` obligatoire). Une heure sans décalage est lue en heure locale du lieu ;
        avec un décalage, elle est convertie. La fin tombe le jour même (après le début) ou le
        lendemain (avant le début, ex. 21:00 → 00:00) ; sinon 400. Un besoin un jour fermé est
        accepté : sa réponse porte `fermeture`.
        EN: Date only = whole day. Local time without offset; converted with offset. End on the
        same day or the next day (under 24 h).
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerNeedInput'}
            example:
              superEvent: {identifier: "8a1f…-uuid-du-planning"}
              about: {identifier: "3c2e…-uuid-de-la-tache"}
              startDate: "2026-11-06T21:00:00"
              endDate: "2026-11-07T00:00:00"
              additionalProperty:
                - {name: nombreSouhaite, value: 2}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerNeed'}
        "400": {description: "Dates impossibles, planning ou tâche introuvable"}
  /api/v2/volunteer-needs/{uuid}/:
    parameters:
      - {in: path, name: uuid, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVolunteerNeed
      summary: "Bénévolat — lire un besoin"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerNeed'}
    patch:
      operationId: patchVolunteerNeed
      summary: "Bénévolat — modifier un besoin (about, startDate/endDate, nombreSouhaite ; pas de changement de planning)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerNeedInput'}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerNeed'}
    delete:
      operationId: deleteVolunteerNeed
      summary: "Bénévolat — supprimer un besoin et ses inscriptions (sans mail)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "204": {description: Deleted}
  /api/v2/volunteer-signups/:
    get:
      operationId: listVolunteerSignups
      summary: "Bénévolat — les inscriptions (RsvpAction)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      parameters:
        - {in: query, name: need, schema: {type: string, format: uuid}}
        - {in: query, name: planning, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/VolunteerSignup'}
    post:
      operationId: createVolunteerSignup
      summary: "Bénévolat — inscrire une personne sur un besoin"
      description: |
        FR: Le compte est créé s'il n'existe pas et rattaché au lieu ; son prénom et son nom ne
        sont écrits que s'ils sont vides. S'ils manquent dans le compte ET dans la requête : 400,
        rien n'est créé. Planning publié et besoin pas passé, sinon 400. Pas de contrôle
        d'adhésion. 201 si créée, 200 si la personne était déjà inscrite (rejouer est sans
        danger). À la création, la personne reçoit « L'équipe t'a inscrit·e » avec le lien
        « Je ne peux plus venir ». `inscritPar` = le compte de la clé.
        EN: 201 when created, 200 when already signed up.
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VolunteerSignupInput'}
            example:
              object: {identifier: "6f1c…-uuid-du-besoin"}
              agent: {email: "camille@exemple.org", givenName: "Camille", familyName: "Martin"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerSignup'}
        "200":
          description: Already signed up
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerSignup'}
        "400": {description: "Besoin passé, planning non publié, email en erreur, nom manquant"}
  /api/v2/volunteer-signups/{uuid}/:
    parameters:
      - {in: path, name: uuid, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVolunteerSignup
      summary: "Bénévolat — lire une inscription"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolunteerSignup'}
    delete:
      operationId: deleteVolunteerSignup
      summary: "Bénévolat — retirer une personne (à tout moment, sans mail)"
      tags: [Volunteering]
      security:
        - ApiKeyAuth: []
      responses:
        "204": {description: Deleted}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      bearerFormat: Api-Key
      description: |
        Pass your key as `Authorization: Api-Key <key>`.
  responses:
    AccountingNotExportable:
      description: >
        This closure is never to be imported (unknown uuid, weekly / monthly /
        yearly closure, J without sales, "reprise" J). The software forgets it.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: {type: string}
              code: {type: string, example: not_exportable}
    AccountingConflict:
      description: >
        Not now: an account or a journal is missing in the venue's chart
        (missing_account), or an entry is unbalanced (unbalanced_entry). The
        software retries later.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: {type: string}
              code: {type: string, enum: [missing_account, unbalanced_entry]}
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          example: Unauthorized
    PostalAddress:
      type: object
      properties:
        '@type':
          type: string
          example: PostalAddress
        name:
          type: string
        streetAddress:
          type: string
        addressLocality:
          type: string
        addressRegion:
          type: string
        postalCode:
          type: string
        addressCountry:
          type: string
        geo:
          type: object
          properties:
            '@type':
              type: string
              example: GeoCoordinates
            latitude:
              type: number
              format: float
            longitude:
              type: number
              format: float
        image:
          type: array
          description: Array of image URLs (main first, then sticker)
          items:
            type: string
            format: uri
    Place:
      type: object
      properties:
        '@type':
          type: string
          example: Place
        address:
          $ref: '#/components/schemas/PostalAddress'
    Event:
      type: object
      description: schema.org/Event JSON-LD representation
      properties:
        '@context':
          type: string
          example: https://schema.org
        '@type':
          type: string
          example: Event
        identifier:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        location:
          $ref: '#/components/schemas/Place'
        url:
          type: string
          format: uri
        additionalType:
          type: string
          description: Human-readable category label (schema.org/Thing.additionalType). Maps to internal category.
        superEvent:
          description: Parent event. Required when the resolved category is ACTION (Volunteering).
          oneOf:
            - type: string
              format: uuid
              description: UUID of the parent Event (recommended for create requests)
            - type: object
              properties:
                '@type':
                  type: string
                  example: Event
                identifier:
                  type: string
                  format: uuid
                name:
                  type: string
        maximumAttendeeCapacity:
          type: integer
        disambiguatingDescription:
          type: string
        eventStatus:
          type: string
          description: e.g. https://schema.org/EventScheduled or https://schema.org/EventCancelled
        audience:
          type: object
          properties:
            '@type':
              type: string
              example: Audience
            audienceType:
              type: string
              example: private
        keywords:
          type: array
          items:
            type: string
        sameAs:
          type: string
          format: uri
        offers:
          type: object
          properties:
            '@type':
              type: string
              example: Offer
            eligibleQuantity:
              type: object
              properties:
                '@type':
                  type: string
                  example: QuantitativeValue
                maxValue:
                  type: integer
            returnPolicy:
              type: object
              properties:
                '@type':
                  type: string
                  example: MerchantReturnPolicy
                merchantReturnDays:
                  type: integer
        additionalProperty:
          type: array
          items:
            type: object
            properties:
              '@type':
                type: string
                example: PropertyValue
              name:
                type: string
                example: optionsRadio
              value:
                oneOf:
                  - type: array
                    items:
                      type: string
                  - type: string
    ProductCreate:
      type: object
      description: schema.org/Product input for creation (with offers and form fields)
      properties:
        '@context':
          type: string
          example: https://schema.org
        '@type':
          type: string
          example: Product
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          description: Human-readable category or internal code
          example: Ticket booking
        isRelatedTo:
          description: |
            Optional link to one OR several Events. Accepts a single UUID, a
            single schema.org Event object, or an array mixing both. The product
            is attached to every resolved Event (M2M Event.products), so the
            same product can be shared across multiple events.
          oneOf:
            - type: string
              format: uuid
            - type: object
              properties:
                '@type':
                  type: string
                  example: Event
                identifier:
                  type: string
                  format: uuid
            - type: array
              description: Several events (UUID strings and/or Event objects)
              items:
                oneOf:
                  - type: string
                    format: uuid
                  - type: object
                    properties:
                      '@type':
                        type: string
                        example: Event
                      identifier:
                        type: string
                        format: uuid
        offers:
          type: array
          items:
            $ref: '#/components/schemas/ProductOfferInput'
        additionalProperty:
          type: array
          items:
            type: object
    Initiative:
      type: object
      description: schema.org/Project representation for Crowds initiatives
      properties:
        '@context':
          type: string
          example: https://schema.org
        '@type':
          type: string
          example: Project
        identifier:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        disambiguatingDescription:
          type: string
        dateCreated:
          type: string
          format: date-time
        currency:
          type: string
          example: EUR
        keywords:
          type: array
          items:
            type: string
        additionalProperty:
          type: array
          items:
            type: object
            properties:
              '@type':
                type: string
                example: PropertyValue
              name:
                type: string
              value:
                oneOf:
                  - type: string
                  - type: boolean
                  - type: number
    BudgetItem:
      type: object
      description: MonetaryAmount-like representation for budget items
      properties:
        '@type':
          type: string
          example: MonetaryAmount
        identifier:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
          example: "120.00"
        currency:
          type: string
          example: EUR
        actionStatus:
          type: string
          example: approved
        dateCreated:
          type: string
          format: date-time
    BudgetItemCreate:
      type: object
      properties:
        description:
          type: string
        amount:
          type: string
          example: "120.00"
        actionStatus:
          type: string
          example: approved
    Participation:
      type: object
      description: schema.org/Action-like representation for participations
      properties:
        '@type':
          type: string
          example: Action
        identifier:
          type: string
          format: uuid
        description:
          type: string
        actionStatus:
          type: string
        object:
          type: object
          properties:
            '@type':
              type: string
              example: Project
            identifier:
              type: string
              format: uuid
            name:
              type: string
