    WebPage:
      type: object
      description: "schema.org/WebPage — page publique composée de blocs"
      properties:
        '@context':
          type: string
          example: https://schema.org
        '@type':
          type: string
          example: WebPage
        identifier:
          type: string
          format: uuid
        name:
          type: string
          description: Titre de la page
        url:
          type: string
          format: uri
          description: "URL publique de la page (/<slug>/)"
        description:
          type: string
          nullable: true
          description: meta_description (SEO)
        isPartOf:
          nullable: true
          description: >
            Page parente (un seul niveau de hiérarchie). Absent si la page est top-level.
            Objet WebPage minimal : @type, identifier (uuid), url, name.
          type: object
          properties:
            '@type':
              type: string
              example: WebPage
            identifier:
              type: string
              format: uuid
            url:
              type: string
            name:
              type: string
        hasPart:
          type: array
          description: Blocs de contenu ordonnés par position
          items:
            $ref: '#/components/schemas/WebPageElement'
        additionalProperty:
          type: array
          description: >
            Méta-champs complémentaires portés en PropertyValue[].
            Clés : slug (string), position (int), publie (bool),
            est_accueil (bool), noindex (bool), meta_title (string).
          items:
            $ref: '#/components/schemas/PropertyValue'
    WebPageCreate:
      type: object
      description: Payload de création de page (avec blocs imbriqués optionnels)
      properties:
        '@context':
          type: string
          example: https://schema.org
        '@type':
          type: string
          example: WebPage
        name:
          type: string
        description:
          type: string
          nullable: true
        isPartOf:
          type: string
          nullable: true
          description: >
            UUID ou slug de la page parente (optionnel). Un seul niveau de hiérarchie.
            Violation des règles du modèle → 400.
        additionalProperty:
          type: array
          description: >
            Méta-champs : slug (string), publie (bool), est_accueil (bool),
            noindex (bool), meta_title (string), position (int).
          items:
            $ref: '#/components/schemas/PropertyValue'
        hasPart:
          type: array
          description: "Blocs à créer atomiquement avec la page (optionnel)"
          items:
            $ref: '#/components/schemas/WebPageElementCreate'
    WebPagePatch:
      type: object
      description: "Champs modifiables sur une page existante (méta uniquement, pas les blocs)"
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        isPartOf:
          type: string
          nullable: true
          description: >
            UUID ou slug de la page parente pour définir un parent.
            Chaîne vide ou null pour retirer le parent (page redevient top-level).
        additionalProperty:
          type: array
          description: >
            Méta-champs à modifier : slug, publie, est_accueil, noindex,
            meta_title, position.
          items:
            $ref: '#/components/schemas/PropertyValue'
    WebPageElement:
      type: object
      description: "schema.org/WebPageElement — un bloc de contenu"
      properties:
        '@type':
          type: string
          example: WebPageElement
        identifier:
          type: string
          format: uuid
        additionalType:
          type: string
          description: >
            Type de bloc (champ pivot du mapping). Valeurs possibles :
            HERO, PARAGRAPHE, IMAGE_TEXTE, CTA, TEMOIGNAGE, VIDEO_TEXTE,
            CARTE, IMAGE, CARTE_LEAFLET, INFOS, FAQ, EVENEMENTS, GALERIE, EMBED,
            MARKDOWN, LISTE_SOUS_PAGES, IFRAME, PARTENAIRES, NEWSLETTER.
            Liste à jour : GET /api/v2/pages/block-types/.
          example: HERO
        headline:
          type: string
          description: Titre du bloc
        alternativeHeadline:
          type: string
          description: Sous-titre du bloc
        text:
          type: string
          description: "Contenu HTML nettoyé par nh3 (whitelist de balises autorisées)"
        image:
          description: >
            URL de l'image principale (string), ou liste ImageObject[]
            pour les blocs GALERIE et PARTENAIRES.
          oneOf:
            - type: string
              format: uri
            - type: array
              items:
                $ref: '#/components/schemas/ImageObject'
        position:
          type: integer
          description: Ordre du bloc dans la page (croissant)
        additionalProperty:
          type: array
          description: >
            Tous les champs supplémentaires du bloc sous forme PropertyValue[].
            Clés possibles : surtitre, badge, image_secondaire (URL),
            image_position, affichage_image (PLEINE_LARGEUR|VIGNETTE_TITRE),
            bouton_label, bouton_url,
            bouton2_label, bouton2_url, auteur_nom, auteur_role,
            auteur_photo (URL), points_gps (JSON), contenu (JSON),
            nombre_max (int), repliable (bool), embed_url, hauteur_px (int).
            Le champ video n'est pas settable via l'API (admin uniquement) ;
            pour une vidéo, utiliser le bloc EMBED (embed_url).
            Format value : string | nombre | booléen | liste | objet JSON.
          items:
            $ref: '#/components/schemas/PropertyValue'
    WebPageElementCreate:
      type: object
      description: Payload pour créer ou modifier un bloc
      properties:
        additionalType:
          type: string
          description: "Type de bloc (requis à la création)"
          example: HERO
        headline:
          type: string
        alternativeHeadline:
          type: string
        text:
          type: string
          description: "HTML (sera nettoyé par nh3 côté serveur)"
        image:
          description: >
            URL http/https (téléchargée par le serveur, ≤ 10 Mo) ou liste
            ImageObject[] pour GALERIE et PARTENAIRES (avec clé `url` optionnelle
            = lien cliquable du logo). URLs internes/privées/loopback refusées
            (protection SSRF). Vidéos : multipart uniquement, pas par URL.
          oneOf:
            - type: string
              format: uri
            - type: array
              items:
                $ref: '#/components/schemas/ImageObject'
        position:
          type: integer
        additionalProperty:
          type: array
          description: >
            Champs complémentaires en PropertyValue[].
            Champs lien (bouton_url, bouton2_url, embed_url) :
            les schémas dangereux (javascript:, data:, vbscript:)
            sont neutralisés automatiquement (champ vidé).
          items:
            $ref: '#/components/schemas/PropertyValue'
    BlockType:
      type: object
      description: "Type de bloc disponible avec ses champs autorisés"
      properties:
        type:
          type: string
          description: Code du type de bloc
          example: HERO
        label:
          type: string
          description: Libellé lisible
          example: "Héro"
        fields:
          type: array
          description: Noms des champs autorisés pour ce type
          items:
            type: string
    ImageObject:
      type: object
      description: "schema.org/ImageObject — image d'un bloc GALERIE ou PARTENAIRES"
      properties:
        '@type':
          type: string
          example: ImageObject
        contentUrl:
          type: string
          format: uri
          description: "URL publique de l'image (téléchargée par le serveur)"
        caption:
          type: string
          description: "Légende de l'image"
        url:
          type: string
          format: uri
          description: >
            Lien cible du logo (bloc PARTENAIRES uniquement, optionnel) : rend le
            logo cliquable dans un nouvel onglet. Les schémas dangereux
            (javascript:, data:, vbscript:) sont neutralisés côté serveur.
    # --- Bénévolat / Volunteering ---
    VolunteerTask:
      type: object
      description: "schema.org/DefinedTerm — une tâche du catalogue du lieu"
      properties:
        '@context': {type: string, example: "https://schema.org"}
        '@type': {type: string, example: DefinedTerm}
        identifier: {type: string, format: uuid}
        name: {type: string, example: "Tenir le bar"}
        description: {type: string}
    VolunteerTaskInput:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        description: {type: string}
    VolunteerPlanning:
      type: object
      description: |
        schema.org/EventSeries. additionalProperty : slug, published, delaiDesinscriptionHeures,
        requiredMembershipPlans (lecture seule), closingCalendar (lecture seule), placesCouvertes,
        placesSouhaitees, renforts, creneauxVides (compteurs des besoins à venir).
      properties:
        '@context': {type: string}
        '@type': {type: string, example: EventSeries}
        identifier: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        url: {type: string, example: "/booking/benevolat/bar-novembre/"}
        startDate: {type: string, format: date, description: "Premier jour des besoins (absent sans besoin)"}
        endDate: {type: string, format: date, description: "Dernier jour des besoins"}
        additionalProperty:
          type: array
          items: {$ref: '#/components/schemas/PropertyValue'}
        subEvent:
          type: array
          description: "Au GET d'un planning seulement"
          items: {$ref: '#/components/schemas/VolunteerNeed'}
    VolunteerPlanningInput:
      type: object
      properties:
        name: {type: string, maxLength: 250}
        description: {type: string}
        additionalProperty:
          type: array
          description: "slug, published, delaiDesinscriptionHeures"
          items: {$ref: '#/components/schemas/PropertyValue'}
    VolunteerNeed:
      type: object
      description: |
        schema.org/Event, additionalType « Volunteering ». startDate avec le décalage du lieu
        (« 2026-11-06T21:00:00+01:00 »), ou la date seule pour une journée (pas d'endDate).
        additionalProperty : nombreSouhaite, nombreInscrits, renforts, fermeture (libellé ou null).
      properties:
        '@context': {type: string}
        '@type': {type: string, example: Event}
        additionalType: {type: string, example: Volunteering}
        identifier: {type: string, format: uuid}
        superEvent:
          type: object
          properties:
            '@type': {type: string, example: EventSeries}
            identifier: {type: string, format: uuid}
            name: {type: string}
        about:
          type: object
          properties:
            '@type': {type: string, example: DefinedTerm}
            identifier: {type: string, format: uuid}
            name: {type: string}
        startDate: {type: string}
        endDate: {type: string}
        remainingAttendeeCapacity: {type: integer}
        attendee:
          type: array
          description: "Prénoms seulement (jamais l'email ni le nom de famille)"
          items:
            type: object
            properties:
              '@type': {type: string, example: Person}
              givenName: {type: string}
        additionalProperty:
          type: array
          items: {$ref: '#/components/schemas/PropertyValue'}
    VolunteerNeedInput:
      type: object
      properties:
        superEvent:
          description: "uuid du planning, ou {identifier: uuid} (création seulement)"
        about:
          description: "uuid de la tâche, ou {identifier: uuid}"
        startDate: {type: string, example: "2026-11-06T21:00:00"}
        endDate: {type: string, example: "2026-11-07T00:00:00"}
        additionalProperty:
          type: array
          description: "nombreSouhaite (>= 1)"
          items: {$ref: '#/components/schemas/PropertyValue'}
    VolunteerSignup:
      type: object
      description: |
        schema.org/RsvpAction. additionalProperty : inscritPar (email du compte de la clé ou de
        l'admin, ou null), rappelEnvoyeLe (date d'envoi du rappel de la veille, ou null).
      properties:
        '@context': {type: string}
        '@type': {type: string, example: RsvpAction}
        identifier: {type: string, format: uuid}
        rsvpResponse: {type: string, example: "https://schema.org/RsvpResponseYes"}
        object:
          type: object
          properties:
            '@type': {type: string, example: Event}
            identifier: {type: string, format: uuid}
        agent:
          type: object
          properties:
            '@type': {type: string, example: Person}
            email: {type: string, format: email}
            givenName: {type: string}
            familyName: {type: string}
        startTime: {type: string, format: date-time}
        additionalProperty:
          type: array
          items: {$ref: '#/components/schemas/PropertyValue'}
    VolunteerSignupInput:
      type: object
      required: [object, agent]
      properties:
        object:
          type: object
          properties:
            identifier: {type: string, format: uuid}
        agent:
          type: object
          required: [email]
          properties:
            email: {type: string, format: email}
            givenName: {type: string, maxLength: 200}
            familyName: {type: string, maxLength: 200}
