  /api/v2/products/:
    get:
      operationId: listProducts
      summary: List Products
      description: >
        Published, non-archived products. With `accounting=true`: the venue's whole
        catalogue for an accounting software that copies it every night (Dolibarr
        "items and sales" mode): every product (published or not, archived or not),
        every price (archived included), sorted by name then uuid, rendered in French,
        with accounting properties in `additionalProperty`. Product: `productType`
        ({code, label}), `posCategory` ({identifier, name, order}, absent without POS
        category), `vatRate` (effective rate, e.g. "20.00"; or `vatRateError`),
        `accountingAccount` ({number, label}; or `accountingAccountError`, the sentence
        of the rule), `forAccountingSync` (false for top-ups, received transfers, card
        emptying, deposit returns, kegs, time top-ups, loyalty, system products),
        `archived`. Each offer: `archived`, `soldByWeightOrVolume`; an offer whose
        `priceCurrency` is not EUR is priced in tokens. The accounting answer carries an
        `ETag` (sha256 of the JSON); send it back in `If-None-Match` to get a 304 when
        nothing changed (a weak `W/` prefix is accepted). Requires the "product" right.
      tags: [Product]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: accounting
          required: false
          schema:
            type: string
            enum: ["true"]
          description: The accounting catalogue (see description).
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
          description: The ETag of the last accounting catalogue read (accounting=true only).
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: With accounting=true only. sha256 of the rendered JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '304':
          description: With accounting=true and If-None-Match equal to the current ETag. No body.
        '403':
          description: Missing, unknown key, or key without the "product" right
    post:
      operationId: createProduct
      summary: Create Product with offers and optional form fields
      tags: [Product]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            examples:
              ticketCreate:
                summary: Create ticket product with prices and form fields
                value:
                  "@context": "https://schema.org"
                  "@type": "Product"
                  name: "Billets - Test Event"
                  category: "Ticket booking"
                  isRelatedTo:
                    "@type": "Event"
                    identifier: "c2a9f2a2-3e6a-4c1e-8d5c-3f8b2d6a9b01"
                  offers:
                    - "@type": "Offer"
                      name: "Tarif Soutien"
                      price: "10.00"
                      priceCurrency: "EUR"
                  additionalProperty:
                    - "@type": "PropertyValue"
                      name: "formFields"
                      value:
                        - label: "Nom"
                          fieldType: "shortText"
                          required: true
                        - label: "Votre motivation"
                          fieldType: "longText"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
