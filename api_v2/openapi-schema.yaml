openapi: 3.0.3
info:
  title: TiBillet API v2
  version: "2.0.0"
  description: |
    Semantic, schema.org-based API.
servers:
  - url: https://{tenant}.{domain}
    variables:
      tenant:
        default: lespass
      domain:
        default: tibillet.localhost
paths:
  /api/v2/events/:
    get:
      operationId: listEvents
      summary: List all published Events
      description: >
        Lists published events. The time filters start from YESTERDAY, not from now:
        an event that began last night is still relevant. They also keep ONGOING events
        (started before the window but still running), by looking at endDate.
      tags: [Event]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: only_futur
          in: query
          required: false
          description: >
            Any truthy value keeps only upcoming or ongoing events (from yesterday on).
            Ignored when `next_days` is supplied.
          schema:
            type: string
            example: "1"
        - name: next_days
          in: query
          required: false
          description: >
            Keep only the events of the next N days (from yesterday on). Takes precedence
            over `only_futur`. Must be an integer between 1 and 366; anything else
            returns 400.
          schema:
            type: integer
            minimum: 1
            maximum: 366
            example: 30
        - name: filter
          in: query
          required: false
          description: >
            Free-text search on the event name, short description and long description.
          schema:
            type: string
            example: concert
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        "400":
          description: >
            `next_days` is not an integer, or is outside the 1..366 range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: next_days doit être compris entre 1 et 366.
    post:
      operationId: createEvent
      summary: Create an Event (schema.org/Event)
      tags: [Event]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
            examples:
              musicCreate:
                summary: Create a music event
                value:
                  "@context": "https://schema.org"
                  "@type": "MusicEvent"
                  name: API v2 — Test create
                  startDate: "2025-12-20T19:00:00Z"
          multipart/form-data:
            schema:
              type: object
              properties:
                '@context':
                  type: string
                  example: https://schema.org
                '@type':
                  type: string
                  example: MusicEvent
                name:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                maximumAttendeeCapacity:
                  type: integer
                disambiguatingDescription:
                  type: string
                description:
                  type: string
                eventStatus:
                  type: string
                audience:
                  type: object
                keywords:
                  type: array
                  items:
                    type: string
                img:
                  type: string
                  format: binary
                sticker_img:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /api/v2/events/{uuid}/:
    get:
      operationId: retrieveEvent
      summary: Retrieve a single Event (by UUID or front slug)
      description: |
        Accepts either the Event UUID, or the front-end slug
        (e.g. my-event-260620-0900-7d51dee7) whose last 8 hex characters are the
        start of the UUID. Mirrors the front controller (EventMVT.retrieve):
        valid UUID -> direct lookup; otherwise uuid__startswith=<last 8 hex>, then
        a slug__startswith fallback. No `published` filter (an unpublished event is
        retrievable). Returns 404 when nothing matches.
      tags: [Event]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          description: Event UUID or front-end slug.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "404":
          description: Not Found — no Event matches this UUID/slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteEvent
      summary: Delete an Event by UUID
      tags: [Event]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /api/v2/events/{uuid}/link-address/:
    post:
      operationId: linkEventAddress
      summary: Link a PostalAddress to an Event (by id or schema.org payload)
      tags: [Event]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    postalAddressId:
                      type: integer
                - $ref: '#/components/schemas/PostalAddress'
      responses:
        '200':
          description: Updated Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /api/v2/events/{uuid}/link-product/:
    post:
      operationId: linkEventProduct
      summary: Attach one or several EXISTING products to an Event
      description: |
        Link already-created Product(s) to this Event via the ManyToMany
        Event.products. The same product can be shared across several events.
        Unlike POST /api/v2/products/ (which creates a product and attaches it),
        this route never creates a product. All product UUIDs are validated
        before anything is attached (no partial link on a bad UUID).
      tags: [Event]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Accepts several flexible shapes. Provide at least one product
                identifier via productId, productIds, product or products.
              properties:
                productId:
                  type: string
                  format: uuid
                  description: A single product UUID
                productIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Several product UUIDs
                product:
                  oneOf:
                    - type: string
                      format: uuid
                    - type: object
                      properties:
                        '@type':
                          type: string
                          example: Product
                        identifier:
                          type: string
                          format: uuid
                products:
                  type: array
                  items:
                    oneOf:
                      - type: string
                        format: uuid
                      - type: object
                        properties:
                          identifier:
                            type: string
                            format: uuid
            examples:
              singleProduct:
                summary: Attach one existing product
                value:
                  productId: "c2a9f2a2-3e6a-4c1e-8d5c-3f8b2d6a9b01"
              severalProducts:
                summary: Attach several existing products
                value:
                  productIds:
                    - "c2a9f2a2-3e6a-4c1e-8d5c-3f8b2d6a9b01"
                    - "d3b8e3b3-4f7b-5d2f-9e6d-4a9c3e7b0c12"
      responses:
        '200':
          description: Updated Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: No/invalid product identifier, or a product was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
