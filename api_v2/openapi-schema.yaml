  /api/v2/wallet-refills/:
    post:
      summary: Top up a user wallet with non-fiat tokens
      description: >
        Credit non-fiat tokens to a user's wallet from the place wallet, without
        payment. Refillable asset categories: TNF (gift), TIM (time), FID
        (loyalty), BDG (badge); fiat (TLF, FED) and subscription (SUB) are
        excluded. The API key must have a gift_asset set in the admin (this both
        enables the permission and restricts the key to that single asset). The
        requested asset must be in a refillable category and must match the
        key's gift_asset. Per-call cap: 10000 (raw unit). The Idempotency-Key
        header is REQUIRED (this endpoint credits tokens): it is stored in DB
        (LigneArticle.idempotency_key, unique constraint = lock). A repeat with
        the same key and the same body returns 208 Already Reported with the
        stored transaction; the same key with a DIFFERENT body is rejected with
        409 Conflict.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: |
            Required client-provided dedup key. Same key + same body -> 208
            (stored transaction). Same key + different body -> 409. A key whose
            previous attempt failed (Fedow error) may be retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, asset, amount]
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.org
                asset:
                  type: string
                  format: uuid
                  description: UUID of the refillable asset (TNF/TIM/FID/BDG) authorized on the key
                amount:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Token amount in raw unit (passed as-is to Fedow)
                  example: 500
      responses:
        '201':
          description: Tokens credited; returns a schema.org MoneyTransfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyTransfer'
        '208':
          description: Idempotent replay (same key, same body); returns the stored MoneyTransfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyTransfer'
        '400':
          description: Invalid payload, or missing required Idempotency-Key header
        '403':
          description: Key not allowed, or asset not authorized for this key
        '409':
          description: |
            Idempotency-Key reused with different parameters, or a refill with
            this key is already in progress.
        '422':
          description: Asset category is not refillable (fiat/subscription), or amount above the cap
        '503':
          description: Fedow service unavailable
  /api/v2/closures/:
    get:
      summary: Daily closures to import into an accounting software
      description: >
        The venue's daily (J) closures that have sales, without the "reprise" J,
        by number. Not paginated. Cursor: pass the `number` of the last imported
        closure in `after_number` (never a date: the automatic J can be created
        late but dated earlier). Requires the "comptabilite" right on the API key.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: after_number
          required: false
          schema:
            type: integer
            minimum: 0
          description: Only closures with a greater number.
      responses:
        "200":
          description: Closures to import
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid: {type: string, format: uuid}
                        number: {type: integer, example: 12}
                        startDate: {type: string, format: date-time}
                        endDate: {type: string, format: date-time}
                        accountingDate: {type: string, format: date, example: "2026-10-12"}
                        entries: {type: string, format: uri}
                        fec: {type: string, format: uri}
        "400":
          description: after_number is not a non-negative integer
        "403":
          description: Missing, unknown key, or key without the "comptabilite" right
  /api/v2/closures/{uuid}/entries/:
    get:
      summary: Accounting entries of a daily closure (JSON)
      description: >
        The same entries as the FEC file, with the FEC column names, amounts in
        whole cents, ISO dates, and no ValidDate (entries arrive unlocked).
        Recomputed at each call with the venue's current chart of accounts:
        import each closure only once.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Entries, one per journal
          content:
            application/json:
              schema:
                type: object
                properties:
                  closure: {type: string, format: uuid}
                  number: {type: integer}
                  accountingDate: {type: string, format: date}
                  currency: {type: string, example: EUR}
                  amountUnit: {type: string, example: cent}
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        JournalCode: {type: string, example: BAR}
                        JournalLib: {type: string, example: Bar}
                        EcritureNum: {type: string, example: 12-BAR}
                        EcritureDate: {type: string, format: date}
                        PieceRef: {type: string, example: "12"}
                        PieceDate: {type: string, format: date}
                        EcritureLib: {type: string}
                        lines:
                          type: array
                          items:
                            type: object
                            properties:
                              CompteNum: {type: string, example: "707000"}
                              CompteLib: {type: string}
                              Debit: {type: integer, example: 0}
                              Credit: {type: integer, example: 41667}
        "404":
          $ref: "#/components/responses/AccountingNotExportable"
        "409":
          $ref: "#/components/responses/AccountingConflict"
  /api/v2/closures/{uuid}/sales/:
    get:
      operationId: listClosureSales
      summary: Sales of a daily closure, split for an invoicing software
      description: >
        The settled euro sales of the closure (CORRECTION sales excluded: their
        payments are added to the corrected sale), by number, split by TiBillet
        into invoice lines, invoice payments, internal transfers (cashless
        top-ups and card emptyings) and various payments (offered top-ups, gift
        tokens taken back, payment gaps). Per account, the result equals the FEC
        of the closure. Sales with nothing to write are not returned. The key
        needs the "comptabilite" AND "sale" rights (buyers' e-mails are
        published). Amounts in whole cents; accounts by their TiBillet number.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: after_number
          required: false
          description: Only sales with a greater number (the `nextAfterNumber` of the previous page).
          schema: {type: integer, minimum: 0}
        - in: query
          name: limit
          required: false
          description: At most this many sales read (1 to 1000, default 500).
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: One page of sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  closure: {type: string, format: uuid}
                  number: {type: integer}
                  accountingDate: {type: string, format: date}
                  currency: {type: string, example: EUR}
                  amountUnit: {type: string, example: cent}
                  nextAfterNumber:
                    type: integer
                    nullable: true
                    description: Pass it as `after_number` for the next page; null on the last page.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        identifier: {type: string, format: uuid}
                        orderNumber: {type: integer, example: 1016}
                        nature: {type: string, enum: [sale, refund, card_emptying]}
                        relatedSale:
                          type: object
                          nullable: true
                          properties:
                            identifier: {type: string, format: uuid}
                            orderNumber: {type: integer}
                        customer:
                          type: object
                          nullable: true
                          description: null for an anonymous buyer (walk-in customer).
                          properties:
                            identifier: {type: string, format: uuid}
                            email: {type: string, format: email}
                        orderedItem:
                          type: array
                          items:
                            type: object
                            properties:
                              priceIdentifier: {type: string, format: uuid, nullable: true, description: "uuid of the TiBillet price (ref_ext of the Dolibarr product); null for the gift-token part"}
                              name: {type: string, example: "Bière — Pinte"}
                              quantity: {type: string, example: "1.000000"}
                              unitPrice: {type: integer, example: 500}
                              totalTTC: {type: integer, example: 500}
                              totalHT: {type: integer, example: 417}
                              totalVAT: {type: integer, example: 83}
                              vatRate: {type: string, example: "20.00"}
                              accountingAccount: {type: string, example: "707000"}
                              vatAccountingAccount: {type: string, nullable: true, example: "445711"}
                        invoicePayments:
                          type: array
                          items:
                            type: object
                            properties:
                              treasuryAccount: {type: string, example: "530000"}
                              method: {type: string, nullable: true, example: CA}
                              amount: {type: integer, example: 500}
                        transfers:
                          type: array
                          items:
                            type: object
                            properties:
                              fromAccount: {type: string, example: "419100"}
                              fromMethod: {type: string, nullable: true}
                              toAccount: {type: string, example: "512100"}
                              toMethod: {type: string, nullable: true, example: CC}
                              amount: {type: integer, example: 1000}
                              label: {type: string, example: Recharge cashless}
                        variousPayments:
                          type: array
                          items:
                            type: object
                            properties:
                              treasuryAccount: {type: string, example: "419100"}
                              method: {type: string, nullable: true}
                              amount: {type: integer, example: -1000, description: "positive: money in; negative: money out"}
                              counterpartAccount: {type: string, example: "623400"}
                              label: {type: string, example: Recharge offerte}
        "400":
          description: after_number or limit invalid
        "403":
          description: The key lacks the comptabilite or the sale right
        "404":
          $ref: "#/components/responses/AccountingNotExportable"
        "409":
          $ref: "#/components/responses/AccountingConflict"
  /api/v2/closures/{uuid}/fec/:
