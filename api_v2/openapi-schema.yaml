  /api/v2/pages/:
    get:
      operationId: listPages
      summary: List all Pages of the current tenant
      tags: [Page]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebPage'
    post:
      operationId: createPage
      summary: Create a Page with nested blocs (schema.org/WebPage, atomic)
      description: |
        FR: Crée une page et ses blocs en une seule requête atomique. Si la création
        d'un bloc échoue (URL image invalide, slug réservé, etc.), l'ensemble est
        annulé. Requiert une clé API avec permission `page`.

        EN: Atomically creates a page and its blocs. Any bloc error (invalid image
        URL, reserved slug, etc.) rolls back the entire creation.
        Requires an API key with `page` permission.
      tags: [Page]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebPageCreate'
            examples:
              pageWithBlocs:
                summary: "Page d'accueil : HERO (identité) + PARAGRAPHE + CTA"
                value:
                  "@context": "https://schema.org"
                  "@type": "WebPage"
                  name: "Accueil"
                  additionalProperty:
                    - "@type": "PropertyValue"
                      name: "slug"
                      value: "accueil"
                    - "@type": "PropertyValue"
                      name: "publie"
                      value: true
                  hasPart:
                    - additionalType: "HERO"
                      headline: "Bienvenue"
                    - additionalType: "PARAGRAPHE"
                      headline: "À propos"
                      text: "<p>Un lieu culturel <strong>coopératif</strong>.</p>"
                    - additionalType: "CTA"
                      additionalProperty:
                        - "@type": "PropertyValue"
                          name: "bouton_label"
                          value: "Voir l'agenda"
                        - "@type": "PropertyValue"
                          name: "bouton_url"
                          value: "/event/"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPage'
        '400':
          description: "Bad Request — slug réservé, URL image invalide, champ requis manquant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: "Forbidden — clé API sans permission `page`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/pages/block-types/:
