{% load static %}
{% load i18n %}

<!--
Leaflet VENDORE en local (meme copie que la carto federation), pas de CDN.
Le CDN unpkg et le serveur de tuiles tile.openstreetmap.org renvoyaient des 403
selon le navigateur (referer/origin) : on evite les deux en servant Leaflet
depuis nos statiques et en prenant le meme fond de carte que /federation/.
/ Leaflet vendored locally (same copy as the federation map), no CDN. unpkg and
tile.openstreetmap.org returned 403 depending on the browser: we serve Leaflet
from our own static files and use the same basemap as /federation/.
-->
<link rel="stylesheet" href="{% static 'seo/vendor/leaflet/leaflet.css' %}"/>
<script src="{% static 'seo/vendor/leaflet/leaflet.js' %}"></script>

<style>
    .map-section {
        margin: 20px 0;
        width: 100%;
    }

    .map-container {
        height: 400px;
        width: 100%;
        border-radius: 8px;
        position: relative;
        z-index: 1;
        display: none; /* Hide map initially */
    }

    .osm-link {
        display: block;
        margin-bottom: 10px;
        text-align: right;
    }

    .map-button {
        display: block;
        width: 100%;
        padding: 15px;
        margin: 20px 0;
        text-align: center;
        transition: all 0.3s ease;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .map-container {
            height: 300px;
        }
    }

    @media (max-width: 480px) {
        .map-container {
            height: 250px;
        }

        .map-button {
            padding: 10px;
        }
    }
</style>

<section class="map-section" itemscope itemtype="http://schema.org/Place">
    <meta itemprop="name" content="{{ event.name }}">
    <meta itemprop="latitude" content="{{ event.postal_address.latitude | safe }}">
    <meta itemprop="longitude" content="{{ event.postal_address.longitude | safe }}">

    <div class="osm-link">
        <a href="https://www.openstreetmap.org/?mlat={{ event.postal_address.latitude | safe }}&mlon={{ event.postal_address.longitude | safe }}&zoom=15"
           target="_blank" rel="noopener noreferrer" aria-label="{% trans 'View on OpenStreetMap in a new tab' %}">
            <i class="bi bi-box-arrow-up-right"></i> {% trans "View on OpenStreetMap" %}
        </a>
    </div>

    <div id="map-{{ event.id }}" class="map-container"
         aria-label="{% trans 'Map showing the location of' %} {{ event.name }}" 
         role="application"
         aria-hidden="true"></div>

    <button id="show-map-button" class="btn btn-lg btn-primary map-button" onclick="initializeMap_{{ event.id }}()">
        <i class="bi bi-map"></i> {% translate "Show Map" %}
    </button>
</section>

<script>
    // Use an IIFE to create a local scope and avoid global variable conflicts
    (function() {
        // Generate a unique ID for this map instance based on the event ID
        const mapId = 'map-{{ event.id }}';

        // Make the initializeMap function available globally but with a unique name
        window.initializeMap_{{ event.id }} = function() {
            try {
                console.log('Starting map initialization for event {{ event.id }}');

                // Get button and map elements
                const mapButton = document.getElementById('show-map-button');
                const mapElement = document.getElementById('map-{{ event.id }}');

                if (!mapElement) {
                    console.error('Map container not found');
                    return;
                }

                // Double-check if Leaflet is loaded
                if (typeof L === 'undefined') {
                    console.error('Leaflet not loaded, cannot initialize map');
                    return;
                }

                // Get coordinates from the event's postal address
                const lat = {{ event.postal_address.latitude | safe }};
                const lng = {{ event.postal_address.longitude | safe }};
                console.log('Map coordinates:', lat, lng);

                // Check if coordinates are valid
                if (isNaN(lat) || isNaN(lng)) {
                    console.error('Invalid coordinates:', lat, lng);
                    return;
                }

                // Show the map container
                mapElement.style.display = 'block';
                mapElement.setAttribute('aria-hidden', 'false');

                // Hide the button
                if (mapButton) {
                    mapButton.style.display = 'none';
                    mapButton.setAttribute('aria-hidden', 'true');
                }

                // Check if the map container already has a map instance
                if (mapElement._leaflet_id) {
                    console.log('Map already initialized');
                    return;
                }

                // Create map with precise coordinates
                console.log('Creating new map instance');
                const mapInstance = L.map('map-{{ event.id }}', {
                    center: [lat, lng],
                    zoom: 15,
                    zoomControl: true,
                    attributionControl: true
                });

                // Fond de carte, identique a la carto federation (explorer.js).
                // Si une cle MapTiler est fournie -> style "dataviz-v4" en francais,
                // tuiles HD. Sinon repli sur les tuiles "Humanitarian" (HOT) hebergees
                // par OpenStreetMap France : labels en francais, sans cle API, OK en
                // localhost, et pas de 403 comme tile.openstreetmap.org.
                // / Basemap identical to the federation map (explorer.js). MapTiler if a
                // key is set, otherwise OSM France Humanitarian (HOT) tiles: no API key,
                // works on localhost, and no 403 like tile.openstreetmap.org.
                const maptilerKey = "{{ maptiler_key|default:''|escapejs }}";

                // Ecouteurs communs aux deux fonds (MapTiler et OSM HOT).
                // / Listeners shared by both basemaps.
                function brancher_ecouteurs_affichage(couche) {
                    couche.on('loading', function () {
                        console.log('Tile layer loading started');
                    });
                    couche.on('load', function () {
                        console.log('Tile layer loaded successfully');
                        // Ensure map is visible after tiles are loaded
                        mapElement.style.display = 'block';
                        // Trigger a resize event to ensure the map renders correctly
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                        }, 100);
                    });
                    couche.on('tileerror', function (error) {
                        console.error('Tile error:', error);
                    });
                }

                function creer_couche_osm_hot() {
                    const couche_osm_hot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, style <a href="https://www.hotosm.org/">Humanitarian OSM Team</a> &middot; <a href="https://openstreetmap.fr/">OpenStreetMap France</a>',
                        maxZoom: 20,
                        subdomains: 'abc'
                    });
                    brancher_ecouteurs_affichage(couche_osm_hot);
                    return couche_osm_hot;
                }

                if (maptilerKey) {
                    const couche_maptiler = L.tileLayer(
                        'https://api.maptiler.com/maps/dataviz-v4/{z}/{x}/{y}.png?key='
                            + maptilerKey + '&language=fr',
                        {
                            attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                            tileSize: 512,
                            zoomOffset: -1,
                            minZoom: 1,
                            maxZoom: 20,
                            crossOrigin: true
                        }
                    );
                    brancher_ecouteurs_affichage(couche_maptiler);

                    // Repli automatique MapTiler -> OSM France HOT (quota epuise,
                    // cle ou origine refusee). Bascule UNE SEULE FOIS si aucune
                    // tuile n'a jamais reussi au premier affichage, ou si le total
                    // d'erreurs atteint SEUIL_ERREURS_TUILES. Retrait DIFFERE
                    // (setTimeout 0) : Leaflet 1.9.4 lit this._map juste apres
                    // fire("load"). Spec : TECH_DOC/SESSIONS/WIDGET_GEO/04-*.md
                    // / Automatic MapTiler -> OSM France HOT fallback (quota, key or
                    // origin refused). Switch ONCE. Layer removal is DEFERRED.
                    const SEUIL_ERREURS_TUILES = 5;
                    let bascule_osm_faite = false;
                    let tuiles_maptiler_ok = 0;
                    let tuiles_maptiler_en_erreur = 0;

                    function basculer_vers_osm_hot() {
                        if (bascule_osm_faite) {
                            return;
                        }
                        bascule_osm_faite = true;
                        console.warn('geoloc: MapTiler indisponible, bascule sur OSM France HOT');
                        setTimeout(function () {
                            mapInstance.removeLayer(couche_maptiler);
                            creer_couche_osm_hot().addTo(mapInstance);
                        }, 0);
                    }

                    couche_maptiler.on('tileload', function () {
                        tuiles_maptiler_ok = tuiles_maptiler_ok + 1;
                    });
                    couche_maptiler.on('tileerror', function () {
                        tuiles_maptiler_en_erreur = tuiles_maptiler_en_erreur + 1;
                        if (tuiles_maptiler_en_erreur >= SEUIL_ERREURS_TUILES) {
                            basculer_vers_osm_hot();
                        }
                    });
                    couche_maptiler.on('load', function () {
                        const aucune_tuile_n_a_jamais_reussi = tuiles_maptiler_ok === 0;
                        if (aucune_tuile_n_a_jamais_reussi && tuiles_maptiler_en_erreur > 0) {
                            basculer_vers_osm_hot();
                        }
                    });

                    couche_maptiler.addTo(mapInstance);
                } else {
                    creer_couche_osm_hot().addTo(mapInstance);
                }

                // Add a marker at the exact coordinates
                const marker = L.marker([lat, lng], {
                    alt: "{{ event.name }}"
                }).addTo(mapInstance);

                // Add a popup with the event's name and address
                marker.bindPopup(`
                    <strong>{{ event.name }}</strong><br>
                    {{ event.postal_address.street_address }}<br>
                    {{ event.postal_address.postal_code }} {{ event.postal_address.address_locality }}
                `).openPopup();

                console.log('Map initialized successfully');

                // Add resize handler for this specific map
                const resizeHandler = function() {
                    if (mapInstance) {
                        mapInstance.invalidateSize();
                    }
                };

                // Add event listener for window resize
                window.addEventListener('resize', resizeHandler);

                // Store the resize handler reference for potential cleanup
                mapElement.dataset.resizeHandler = true;

            } catch (error) {
                console.error('Error initializing map:', error);
                // Show error message to user
                const errorMapElement = document.getElementById('map-{{ event.id }}');
                if (errorMapElement) {
                    errorMapElement.innerHTML = '<div class="alert alert-danger">{% trans "Unable to load map. Please try again later." %}</div>';
                    errorMapElement.style.display = 'block';
                }
            }
        };
    })();
</script>
