[pytest]
DJANGO_SETTINGS_MODULE = TiBillet.settings
markers =
    integration: integration tests for API v2
    onboard: onboard wizard tests (use shared dev DB, no migrations)
    e2e: end-to-end Playwright browser tests (require running server via Traefik)
    stripe_listen: E2E qui exige `stripe listen` (webhook de confirmation).
        Ignore sans STRIPE_REEL=1 (make e2e-stripe), et signale bruyamment en fin de run.
    stripe_reel: pytest qui appelle le vrai Stripe en mode test (paiements, remboursements).
        Ignore sans STRIPE_REEL=1 (make test-stripe), et signale bruyamment en fin de run.
filterwarnings =
    ignore:Unverified HTTPS request is being made to host.*:urllib3.exceptions.InsecureRequestWarning
