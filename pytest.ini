[pytest]
DJANGO_SETTINGS_MODULE = TiBillet.settings
markers =
    adhesion: famille E2E — toutes les façons d'adhérer et de gérer une adhésion (public, compte, admin)
    validation_manuelle: famille E2E — adhésions à validation manuelle (sous-famille de adhesion)
    billetterie: famille E2E — événements, réservations et billets
    panier: famille E2E — le panier (billets, adhésions, créneaux, vrai paiement)
    qrcode: famille E2E — payer par QR code
    caisse: famille E2E — la vraie caisse (point de vente) et son stock
    caisse_composants: famille E2E — le JavaScript de la caisse sur une page fabriquée, sans habillage
    monnaie: famille E2E — monnaies, Fedow, cartes, fédération entre lieux
    admin: famille E2E — configuration, produits et comptabilité dans l'admin
    crowds: famille E2E — financement participatif
    explorer: famille E2E — la carte et la recherche de l'explorer
    site: famille E2E — connexion, langue, navigation, Mon espace
    benevolat: famille E2E — le planning des bénévoles (s'inscrire, se retirer, fenêtre du nom)
    integration: integration tests for API v2
    onboard: onboard wizard tests (use shared dev DB, no migrations)
    e2e: end-to-end Playwright browser tests (require running server via Traefik)
    stripe_listen: E2E qui exige `stripe listen` (webhook de confirmation).
        Tourne a chaque make e2e ; echoue si `stripe listen` ne tourne pas dans byobu.
    stripe_reel: pytest qui appelle le vrai Stripe en mode test (paiements, remboursements).
        Tourne a chaque make test ; echoue si Stripe n'est pas joignable.
filterwarnings =
    ignore:Unverified HTTPS request is being made to host.*:urllib3.exceptions.InsecureRequestWarning
