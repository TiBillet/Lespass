{% load i18n static %}

<div class="mb-4 flex flex-row gap-4">
    <div class="flex flex-col">
        <a
                class="bg-primary-600 font-medium gap-2 items-center h-[38px] justify-center px-3 py-2 rounded-default text-white"
                href="https://nuage.codecommun.coop/s/zaG9wqHBfjaqj38"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="{% trans 'Télécharger l’application de scan' %}">
            📲 <span>{% trans "Télécharger l’application de scan de billets" %} 🎟️</span>
        </a>
        <p>{% translate 'Ou avec le QRcode :' %} </p>
        <div class="flex flex-row gap-2">
            <div class="qr-code-container">
                <div id="qrcode-js" class="d-flex justify-content-center"></div>
                <script src="{% static 'commun/js/qrcode.min.js' %}"></script>
                <script>
                    (function(){
                        const content = "https://nuage.codecommun.coop/s/zaG9wqHBfjaqj38";
                        const container = document.querySelector('.qr-code-container');
                        const holder = document.getElementById('qrcode-js');
                        if(!container || !holder || !content){ return; }
                        function sizePx(){
                            const w = container.clientWidth || 128;
                            const s = Math.max(128, Math.min(128, Math.floor(w - 20)));
                            return s;
                        }
                        let currentSize = 0;
                        let qri = null;
                        function render(){
                            const s = sizePx();
                            if(Math.abs(s - currentSize) < 16 && qri){ return; }
                            currentSize = s;
                            holder.innerHTML = "";
                            qri = new QRCode(holder, {
                                text: content,
                                width: s,
                                height: s,
                                colorDark : "#000000",
                                colorLight : "#ffffff",
                                correctLevel : QRCode.CorrectLevel.H
                            });
                        }
                        render();
                        let to=null;
                        window.addEventListener('resize', function(){
                            clearTimeout(to);
                            to=setTimeout(render, 150);
                        });
                    })();
                </script>
            </div>
        </div>
    </div>
</div>
